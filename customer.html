border-radius:22px;background:linear-gradient(145deg,var(--panel2),var(--panel));box-shadow:0 16px 36px #0007;padding:18px;overflow:hidden}.cardHead{display:flex;justify-content:space-between;align-items:end;gap:12px;padding-bottom:11px;border-bottom:1px solid #8f74485a}.card h3{margin:0;font-size:clamp(1.2rem,1.7vw,1.7rem)}.cardHead strong{color:var(--gold);font-size:clamp(1.2rem,1.8vw,1.8rem)}.item{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid #27443f;font-size:clamp(.92rem,1.2vw,1.15rem)}.item:last-child{border-bottom:0}.item small{color:var(--muted)}.item b:last-child{white-space:nowrap}.roundTotal{margin-top:10px;padding:10px 13px;border-radius:14px;background:#0d2b25;border:1px solid #b18b4857}.roundTotal .item{padding:6px 0}.player{padding:11px 0;border-bottom:1px solid #28463f}.player:last-child{border-bottom:0}.playerTop{display:flex;justify-content:space-between;gap:12px;align-items:center}.playerName{font-size:clamp(1rem,1.35vw,1.3rem);font-weight:900}.balance{font-size:clamp(1.05rem,1.5vw,1.45rem);font-weight:900;color:var(--gold)}.paid{color:#79dca8}.breakdown{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px;color:var(--muted);font-size:clamp(.74rem,.9vw,.92rem)}.extraTag{color:#f4ca63}.summaryCol{display:grid;gap:10px;align-content:start}.mesaHero{min-height:142px;padding:18px;border:1px solid #c59a4e;border-radius:22px;background:linear-gradient(110deg,#062a22ed,#07382fed),url('billar-luxury-clean.jpg') center/cover no-repeat;position:relative}.mesaHero h2{font-size:clamp(1.45rem,2.4vw,2.5rem);margin:4px 0}.mesaNum{position:absolute;right:18px;bottom:12px;text-align:right}.mesaNum small{display:block;color:#f3ddb0;font-weight:800;letter-spacing:.12em}.mesaNum strong{display:block;color:var(--gold);font-family:Georgia,serif;font-size:clamp(3.5rem,5.5vw,6rem);line-height:.82}.stat{padding:13px 15px;border:1px solid #8f74485c;border-radius:16px;background:#07181be8}.stat small{display:block;color:var(--muted);font-weight:750;text-transform:uppercase;letter-spacing:.07em}.stat strong{display:block;margin-top:3px;font-size:clamp(1.35rem,2vw,2rem);color:var(--gold)}.stat.total{border-color:#c59a4e;background:linear-gradient(135deg,#0c2d25,#081c1b)}.stat.total strong{font-size:clamp(1.8rem,2.8vw,2.8rem)}.history{margin-top:14px;padding:12px 18px}.historyRows{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.hist{padding:8px 10px;border-right:1px solid #28463f}.hist:last-child{border-right:0}.hist small{color:var(--muted);display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tagline{text-align:center;color:#e8c66e;font-family:Georgia,serif;font-style:italic;font-size:1rem;letter-spacing:.05em;padding:12px 6px 2px}.empty{padding:28px 8px;text-align:center;color:var(--muted)}.pageHint{font-size:.72rem;color:#8da39d;margin-left:8px;font-weight:600}

@media(min-width:1000px) and (orientation:landscape){html,body{height:100%;overflow:hidden}.wrap{height:100vh;max-width:none;padding:1.35vh 1.25vw;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:1.1vh}.top{min-height:0;height:12.5vh;padding:1vh 1.2vw;border-radius:1.5vw}.logoBox{height:10vh;max-height:105px}.title{font-size:min(4.2vh,2.8vw)}.eyebrow{font-size:min(1.6vh,.85vw)}.state{font-size:min(1.7vh,.9vw);padding:.5vh .7vw}.clock{font-size:min(1.6vh,.85vw)}.clock b{font-size:min(2.2vh,1.15vw)}.tvgrid{margin:0;min-height:0;gap:1vw;grid-template-columns:1.12fr 1fr .72fr}.card{height:100%;min-height:0;padding:1.3vh 1vw;border-radius:1.4vw}.cardHead{padding-bottom:.8vh}.card h3{font-size:min(2.7vh,1.45vw)}.cardHead strong{font-size:min(2.8vh,1.5vw)}.item{padding:.9vh 0;font-size:min(2.05vh,1.05vw)}.roundTotal{margin-top:.8vh;padding:.7vh .8vw}.roundTotal .item{padding:.45vh 0}.player{padding:.8vh 0}.playerName{font-size:min(2.2vh,1.12vw)}.balance{font-size:min(2.35vh,1.2vw)}.breakdown{font-size:min(1.55vh,.8vw);margin-top:.35vh;gap:.6vw}.summaryCol{height:100%;min-height:0;grid-template-rows:1.45fr repeat(3,1fr);gap:.8vh}.mesaHero{min-height:0;height:auto;padding:1.2vh 1vw;border-radius:1.4vw}.mesaHero h2{font-size:min(3.2vh,1.7vw)}.mesaNum{right:1vw;bottom:1vh}.mesaNum strong{font-size:min(7vh,4vw)}.mesaNum small{font-size:min(1.4vh,.75vw)}.stat{padding:1vh .9vw;border-radius:1vw;display:flex;flex-direction:column;justify-content:center}.stat small{font-size:min(1.55vh,.8vw)}.stat strong{font-size:min(2.8vh,1.5vw)}.stat.total strong{font-size:min(3.7vh,2vw)}.history{margin:0;height:10.5vh;padding:.8vh 1vw}.history .cardHead{float:left;width:18%;height:100%;border:0;display:flex;align-items:center}.historyRows{height:100%;grid-template-columns:repeat(3,1fr);align-items:center}.hist{font-size:min(1.75vh,.9vw);padding:.4vh .7vw}.hist small{font-size:min(1.45vh,.75vw)}.tagline{padding:0;font-size:min(1.65vh,.9vw);line-height:2vh}.empty{padding:3vh .5vw; </style></head><body><div class="wrap" id="app"></div><script>
const KEY='lhAdminV4',COP=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0),GAME=2000,params=new URLSearchParams(location.search),id=params.get('table')||'B1';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rc(r){return(r?.items||[]).reduce((s,i)=>s+(+i.price||0)*(+i.qty||0),0)}
function accountData(a){let names=new Set(),rounds={},extras={},paid={},returns={};for(const z of a.rounds||[]){names.add(z.loser);rounds[z.loser]=(rounds[z.loser]||0)+GAME+rc(z)}for(const e of a.playerExtras||[]){names.add(e.player);extras[e.player]=(extras[e.player]||0)+(+e.price||0)*(+e.qty||0)}for(const p of a.payments||[]){if(p.player){names.add(p.player);paid[p.player]=(paid[p.player]||0)+(+p.amount||0)}}for(const d of a.returns||[]){if(d.player){names.add(d.player);returns[d.player]=(returns[d.player]||0)+(+d.credit||0)}}return [...names].map(name=>({name,rounds:rounds[name]||0,extras:extras[name]||0,paid:paid[name]||0,returns:returns[name]||0,balance:Math.max(0,(rounds[name]||0)+(extras[name]||0)-(paid[name]||0)-(returns[name]||0))})).sort((x,y)=>y.balance-x.balance)}
function tvMode(){return innerWidth>=1000&&innerWidth>innerHeight}function rotatingSlice(arr,size,seconds=7){if(!tvMode()||arr.length<=size)return arr;let pages=Math.ceil(arr.length/size),p=Math.floor(Date.now()/(seconds*1000))%pages;return arr.slice(p*size,p*size+size)}function hint(arr,size){return tvMode()&&arr.length>size?`<span class="pageHint">• rotación automática</span>`:''}
function draw(){let S;try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}let t=S?.tables?.find(x=>x.id===id),a=t?.account;if(!a){app.innerHTML=`<div class="top"><div class="logoBox"><img src="herradura-logo-master.png" alt="La Herradura"></div><div class="topMain"><div class="eyebrow">Pantalla del cliente</div><div class="title">${esc(t?.name||id)}</div><span class="state">Mesa disponible</span></div><div class="clock">LA HERRADURA<b>${new Date().toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'})}</b></div></div><div class="card empty"><h2>🎱 Mesa disponible</h2><p>Esperando apertura de cuenta…</p></div>`;return}
let r=a.activeRound,n=(a.rounds?.length||0)+1,players=accountData(a),roundNow=rc(r),totalPending=players.reduce((s,p)=>s+p.balance,0),mesa=(t.name.match(/\d+/)||['1'])[0],roundItems=r?.items||[],shownItems=rotatingSlice(roundItems,5),shownPlayers=rotatingSlice(players,4),hist=[...(a.rounds||[])].reverse(),shownHist=rotatingSlice(hist,3,9);
app.innerHTML=`<div class="top"><div class="logoBox"><img src="herradura-logo-master.png" alt="Billares La Herradura Club"></div><div class="topMain"><div class="eyebrow">Billares La Herradura Club · Experiencia Premium</div><div class="title">${esc(t.name)} · Partida ${n}</div><span class="state"><span class="dot"></span> PARTIDA EN CURSO</span></div><div class="clock">${esc(a.group||'')}<b>${new Date().toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'})}</b></div></div>
<div class="tvgrid"><section class="card"><div class="cardHead"><h3>🧾 Ronda actual · Partida ${n}${hint(roundItems,5)}</h3><strong>${COP(roundNow)}</strong></div>${shownItems.length?shownItems.map(i=>`<div class="item"><span><b>${esc(i.name)}</b> × ${+i.qty||0}${i.extra?' <small>· Extra de ronda</small>':''}<br><small>${i.addedAt?new Date(i.addedAt).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'}):''}</small></span><b>${COP((+i.price||0)*(+i.qty||0))}</b></div>`).join(''):'<div class="empty">Aún no hay productos despachados en esta ronda.</div>'}<div class="roundTotal"><div class="item"><b>Consumo de ronda</b><b>${COP(roundNow)}</b></div><div class="item"><span>🎱 Chico al finalizar</span><b>${COP(GAME)}</b></div><div class="item"><b>Total al perdedor</b><b>${COP(roundNow+GAME)}</b></div></div></section>
<section class="card"><div class="cardHead"><h3>👥 Cuentas de jugadores${hint(players,4)}</h3><strong>${COP(totalPending)}</strong></div>${shownPlayers.length?shownPlayers.map(p=>`<div class="player"><div class="playerTop"><div class="playerName">👤 ${esc(p.name)}</div><div class="balance ${p.balance<=0?'paid':''}">${p.balance>0?COP(p.balance):'✓ PAGADO'}</div></div><div class="breakdown"><span>🎱 Rondas + chicos: <b>${COP(p.rounds)}</b></span>${p.extras?`<span class="extraTag">🟡 Extras: <b>${COP(p.extras)}</b></span>`:''}${p.returns?`<span>↩️ −${COP(p.returns)}</span>`:''}</div></div>`).join(''):'<div class="empty">Aún no hay partidas asignadas.</div>'}</section>
<aside class="summaryCol"><div class="mesaHero"><div class="eyebrow">Mesa activa</div><h2>${esc(a.group||'Cuenta de billar')}</h2><div class="mesaNum"><small>MESA DE BILLAR</small><strong>${mesa}</strong></div></div><div class="stat"><small>Consumo ronda actual</small><strong>${COP(roundNow)}</strong></div><div class="stat"><small>Chico al finalizar</small><strong>${COP(GAME)}</strong></div><div class="stat total"><small>Total pendiente mesa</small><strong>${COP(totalPending)}</strong></div></aside></div>
<section class="card history"><div class="cardHead"><h3>🏁 Últimas partidas${hint(hist,3)}</h3></div><div class="historyRows">${shownHist.length?shownHist.map(z=>`<div class="hist"><b>Partida ${(a.rounds||[]).indexOf(z)+1} · ${esc(z.loser)}</b><small>${(z.items||[]).map(x=>`${esc(x.name)} ×${+x.qty||0}`).join(' · ')||'Sin consumo'} · ${COP(GAME+rc(z))}</small></div>`).join(''):'<div class="empty">Sin partidas finalizadas.</div>'}</div></section><div class="tagline">✦ La Herradura · Juega · Disfruta · Comparte ✦</div>`}
draw();addEventListener('storage',e=>{if(e.key===KEY)draw()});addEventListener('resize',draw);setInterval(draw,2500);
</script></body></html>
