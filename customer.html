<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030914"><title>Pantalla Cliente · La Herradura</title><style>
:root{--gold:#f4c75d;--blue:#168bff;--green:#20c875;--muted:#9fb1c5;--line:#213650}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#102641,#030914 65%);color:white;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.wrap{max-width:1200px;margin:auto;padding:clamp(18px,3vw,44px)}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{font-weight:900;letter-spacing:1px;color:var(--gold)}h1{font-size:clamp(2rem,5vw,4.5rem);margin:.15em 0}.state{display:inline-block;padding:8px 14px;border-radius:999px;background:#17334e;color:#d8edff;font-weight:800}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:18px}.card{background:#091725dd;border:1px solid var(--line);border-radius:22px;padding:20px}.big{font-size:clamp(2rem,5vw,4rem);font-weight:900;color:var(--gold)}.item{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--line);font-size:clamp(1rem,2vw,1.45rem)}small{color:var(--muted)}.players .item b:last-child{color:var(--gold)}.time{color:var(--muted);text-align:right}.empty{text-align:center;padding:80px 20px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}header{flex-direction:column}.time{text-align:left}}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}.theme-premium:before{background:radial-gradient(circle at 50% -10%,#95661d33,transparent 34%),linear-gradient(145deg,#02070c,#061822 58%,#030914)}.theme-premium .card{border-color:#70572a;box-shadow:0 18px 45px #0008}.theme-premium .brand{font-family:Georgia,serif;letter-spacing:2px}.theme-felt:before{background:radial-gradient(circle at 50% 0,#11604d88,transparent 52%),linear-gradient(135deg,#04100c,#061b17 55%,#020806)}.theme-felt .card{background:#071b17e8;border-color:#27735f}.theme-nocturno:before{background:radial-gradient(circle at top,#183d67aa,transparent 48%),linear-gradient(#020711,#030914)}.theme-nocturno .card{border-color:#315a82}.theme-vip:before{background:radial-gradient(ellipse at 50% -5%,#d0a54b35,transparent 32%),radial-gradient(circle at 15% 30%,#12614d55,transparent 28%),linear-gradient(145deg,#020806,#071713 58%,#020711)}.theme-vip .card{background:linear-gradient(145deg,#09251eef,#081521f2);border-color:#a98543;box-shadow:0 20px 55px #000a,inset 0 1px #ffffff12}.theme-vip .brand,.theme-vip h1{font-family:Georgia,serif}.theme-vip .heroMesa{border-color:#c69b4b;background:linear-gradient(120deg,#0d352b,#0a1723)}.theme-luxury:before{background:radial-gradient(circle at 75% 0,#245d9255,transparent 36%),radial-gradient(circle at 5% 80%,#9d77312c,transparent 30%),linear-gradient(140deg,#02050a,#071321 58%,#05070b)}.theme-luxury .card{background:linear-gradient(145deg,#0d2235f2,#080f19f5);border-color:#7e6946;box-shadow:0 20px 55px #000b}.theme-luxury .heroMesa{border-color:#8f7447;background:linear-gradient(120deg,#102a40,#0b1018)}.theme-minimal:before{background:#07111e}.theme-minimal .card{box-shadow:none;background:#0b1725}.heroMesa{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:18px 0;padding:18px 24px;border:1px solid #70572a;border-radius:24px;background:linear-gradient(120deg,#0b201bdf,#09131fdf)}.heroMesa .number{font-size:clamp(3rem,9vw,7rem);line-height:.8;font-family:Georgia,serif;color:var(--gold);font-weight:900}.heroMesa small{letter-spacing:.18em;color:#e9d39b}.tagline{text-align:center;color:var(--gold);font-family:Georgia,serif;font-style:italic;font-size:clamp(1.2rem,3vw,2rem);margin:24px 0}

/* v4.12.1 · pantalla cliente tipo salón VIP */
.theme-vip{background:radial-gradient(ellipse at 50% -5%,#6f4c1e55,transparent 35%),radial-gradient(circle at 15% 45%,#0f634b66,transparent 35%),linear-gradient(145deg,#020705,#061713 55%,#02070d)}
.theme-vip .wrap{max-width:1350px}.theme-vip header{border-bottom:1px solid #b58a4566}.theme-vip .brand{color:#e7c46d;text-shadow:0 2px 14px #000}.theme-vip h1{font-family:Georgia,serif}.theme-vip .heroMesa{position:relative;overflow:hidden;background:linear-gradient(90deg,#4b2d17 0 12px,#bd914d 12px 15px,#07513c 15px calc(100% - 15px),#bd914d calc(100% - 15px) calc(100% - 12px),#4b2d17 calc(100% - 12px));border:1px solid #e0ba68;border-radius:30px;box-shadow:inset 0 0 45px #001d13,0 22px 50px #000b;padding:28px 34px}.theme-vip .heroMesa:before{content:"●";position:absolute;left:8px;top:6px;color:#020604;font-size:1.4rem;text-shadow:calc(100vw - 100px) 0 #020604}.theme-vip .heroMesa:after{content:"●";position:absolute;left:8px;bottom:5px;color:#020604;font-size:1.4rem}.theme-vip .heroMesa .number{color:#f3d27b;text-shadow:0 3px 12px #000}.theme-vip .card{border:1px solid #9c7a4266;background:linear-gradient(145deg,#0b241ddd,#071521f2);box-shadow:0 18px 42px #0009}.theme-vip .tagline:before{content:"♛  ";}.theme-vip .tagline:after{content:"  ♛";}
.theme-luxury{background:radial-gradient(circle at 75% -10%,#1d568e88,transparent 38%),linear-gradient(145deg,#02050a,#06111f 55%,#020408)}.theme-luxury .heroMesa{background:linear-gradient(135deg,#143a5ddd,#071421f2);border:1px solid #d2b26a;border-radius:30px;box-shadow:0 22px 55px #000c,inset 0 0 35px #168bff1c}.theme-luxury .brand,.theme-luxury h1{font-family:Georgia,serif}.theme-luxury .brand{color:#ead08b}.theme-luxury .card{border-color:#8d744a;background:linear-gradient(145deg,#0c2337ef,#070f19f5)}

/* v4.13.0 · pantalla cliente HERRADURA SIGNATURE */
.theme-signature{background:radial-gradient(ellipse at 50% -10%,#a4762838,transparent 34%),radial-gradient(circle at 12% 50%,#0c5b4550,transparent 32%),linear-gradient(145deg,#020705,#071713 55%,#02070d)}
.theme-signature .wrap{max-width:1400px}.theme-signature header{border-bottom:1px solid #c49a4d66}.theme-signature .brand{font-family:Georgia,serif;color:#edcd7b;letter-spacing:.12em;text-shadow:0 3px 16px #000}.theme-signature h1{font-family:Georgia,serif}.theme-signature .heroMesa{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 45%,#12684f,#07513d 48%,#033126);border:10px solid #3b2415;outline:2px solid #c99a4b;outline-offset:-7px;border-radius:34px;box-shadow:inset 0 0 0 2px #e6c26c55,inset 0 0 55px #001a12,0 26px 58px #000d;padding:32px 38px}.theme-signature .heroMesa:before{content:"●                         ●";white-space:pre;position:absolute;left:8px;right:8px;top:2px;color:#010403;font-size:1.4rem;display:flex;justify-content:space-between}.theme-signature .heroMesa:after{content:"LA HERRADURA • SIGNATURE";position:absolute;right:26px;bottom:13px;color:#e1bd675c;font:600 .7rem Georgia,serif;letter-spacing:.24em}.theme-signature .heroMesa .number{color:#f2ce72;text-shadow:0 4px 14px #000}.theme-signature .heroMesa small{color:#f3dfaa}.theme-signature .card{background:linear-gradient(145deg,#0a241dde,#071521f2);border:1px solid #ad874866;box-shadow:0 20px 46px #000a}.theme-signature .tagline{color:#e7c46d;letter-spacing:.06em}.theme-signature .tagline:before{content:"✦  ";}.theme-signature .tagline:after{content:"  ✦";}


.theme-grand{background:radial-gradient(ellipse at 50% -12%,#b7862f2e,transparent 30%),radial-gradient(circle at 15% 55%,#0c654b44,transparent 34%),linear-gradient(145deg,#020605,#07130f 56%,#02060a)}.theme-grand .wrap{max-width:1450px}.theme-grand header{border-bottom:1px solid #d2ad5a66}.theme-grand .brand{font-family:Georgia,serif;color:#f0d17d;letter-spacing:.14em;text-shadow:0 3px 18px #000}.theme-grand h1{font-family:Georgia,serif}.theme-grand .heroMesa{position:relative;overflow:hidden;padding:34px 40px;background:radial-gradient(ellipse at 50% 40%,#168260,#09684e 45%,#03402f);border:12px solid #291a12;outline:2px solid #d8b663;outline-offset:-8px;border-radius:38px;box-shadow:inset 0 0 0 2px #e7c87544,inset 0 0 70px #00150e,0 28px 64px #000e}.theme-grand .heroMesa:before{content:"";position:absolute;inset:3px;pointer-events:none;background:radial-gradient(circle at 9px 9px,#010302 0 8px,#72542d 9px 10px,transparent 11px),radial-gradient(circle at calc(100% - 9px) 9px,#010302 0 8px,#72542d 9px 10px,transparent 11px),radial-gradient(circle at 9px calc(100% - 9px),#010302 0 8px,#72542d 9px 10px,transparent 11px),radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),#010302 0 8px,#72542d 9px 10px,transparent 11px)}.theme-grand .heroMesa:after{content:"LA HERRADURA · GRAND CLUB";position:absolute;right:30px;bottom:15px;color:#f0d17d77;font:600 .7rem Georgia,serif;letter-spacing:.25em}.theme-grand .heroMesa .number{color:#f3d27a;text-shadow:0 4px 16px #000}.theme-grand .heroMesa small{color:#f5e4b5}.theme-grand .card{background:linear-gradient(145deg,#09241cde,#071521f4);border:1px solid #b5904e77;box-shadow:0 22px 50px #000b,inset 0 1px #fff1}.theme-grand .tagline{color:#edca72;letter-spacing:.07em}.theme-grand .tagline:before{content:"◆  ";}.theme-grand .tagline:after{content:"  ◆";}
</style></head><body><div class="wrap" id="app"></div><script>
const KEY='lhAdminV4',COP=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0),GAME=2000,params=new URLSearchParams(location.search),id=params.get('table')||'B1',theme=params.get('theme')||'premium';document.body.classList.add('theme-'+theme);
function rc(r){return(r?.items||[]).reduce((s,i)=>s+i.price*i.qty,0)}function returnsFor(a,n){return(a?.returns||[]).filter(d=>!n||d.player===n).reduce((z,d)=>z+d.credit,0)}function draw(){let S=JSON.parse(localStorage.getItem(KEY)||'null'),t=S?.tables?.find(x=>x.id===id),a=t?.account;if(!a){app.innerHTML=`<header><div><div class="brand">🎱 Billares La Herradura Club</div><h1>${t?.name||id}</h1></div><div class="time">Última actualización<br><b>${new Date().toLocaleTimeString('es-CO')}</b></div></header><div class="card empty"><h2>Mesa disponible</h2><p>Esperando apertura de cuenta…</p></div>`;return}let r=a.activeRound,n=(a.rounds?.length||0)+1,m={};for(const z of a.rounds||[])m[z.loser]=(m[z.loser]||0)+GAME+rc(z);for(const e of a.playerExtras||[])m[e.player]=(m[e.player]||0)+e.price*e.qty;for(const p of a.payments||[])m[p.player]=(m[p.player]||0)-p.amount;for(const d of a.returns||[])if(d.player)m[d.player]=(m[d.player]||0)-d.credit;app.innerHTML=`<header><div><div class="brand">🎱 Billares La Herradura Club</div><h1>${t.name} · Partida ${n}</h1><span class="state">● PARTIDA EN CURSO · PENDIENTE DE PERDEDOR</span></div><div class="time">${a.group}<br>Última actualización <b>${new Date().toLocaleTimeString('es-CO')}</b></div></header><div class="heroMesa"><div><small>LA HERRADURA · EXPERIENCIA DE JUEGO</small><h2>${a.group}</h2></div><div><small>MESA DE BILLAR</small><div class="number">${(t.name.match(/\d+/)||['1'])[0]}</div></div></div><div class="grid"><section class="card"><h2>Ronda actual</h2>${r?.items?.length?r.items.map(i=>`<div class="item"><span>${i.extra?'➕ Extra · ':''}${i.name} × ${i.qty}<br><small>${i.addedAt?new Date(i.addedAt).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'}):''}</small></span><b>${COP(i.price*i.qty)}</b></div>`).join(''):'<p><small>Aún no hay productos despachados.</small></p>'}<div class="item"><b>Consumo de ronda</b><b>${COP(rc(r))}</b></div><div class="item"><span>Chico al finalizar</span><b>${COP(GAME)}</b></div><p><small>El total de esta ronda se asignará al perdedor cuando termine la partida.</small></p></section><section class="card players"><h2>Cuentas acumuladas</h2>${Object.keys(m).length?Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="item"><span>👤 ${n}</span><b>${COP(v)} pendiente</b></div>`).join(''):'<p><small>Aún no hay partidas asignadas.</small></p>'}<hr style="border-color:var(--line)"><small>Partidas finalizadas: ${a.rounds?.length||0}</small></section></div>${(a.returns||[]).length?`<section class="card" style="margin-top:18px"><h2>↩️ Devoluciones aplicadas</h2>${[...a.returns].reverse().map(d=>`<div class="item"><span>${d.name} × ${d.qty}${d.player?' · '+d.player:''}</span><b>− ${COP(d.credit)}</b></div>`).join('')}</section>`:''}<section class="card" style="margin-top:18px"><h2>Historial de partidas</h2>${a.rounds?.length?[...a.rounds].reverse().slice(0,8).map((z,i)=>`<div class="item"><span>Partida ${a.rounds.indexOf(z)+1} · Perdedor: <b>${z.loser}</b><br><small>${z.items.map(x=>`${x.name} ×${x.qty}`).join(' · ')||'Sin consumo'}</small></span><b>${COP(GAME+rc(z))}</b></div>`).join(''):'<p><small>Sin partidas finalizadas.</small></p>'}</section><div class="tagline">¡Disfruta el juego!</div>`}
draw();addEventListener('storage',e=>{if(e.key===KEY)draw()});setInterval(draw,3000);
</script></body></html>
