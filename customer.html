<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#04110f"><title>Pantalla Cliente · La Herradura v4.19.16</title><style>
:root{--gold:#f3c85d;--gold2:#d7a944;--green:#20c875;--ink:#f7f8f8;--muted:#9fb1bd;--line:#28463f;--panel:#071a1bde;--panel2:#0a2021ef}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020908;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(circle at 50% -12%,#b7892b20,transparent 31%),radial-gradient(circle at 12% 38%,#0b684c38,transparent 34%),linear-gradient(145deg,#020807,#061612 55%,#02070b)}body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#02090899,#020908ed),url('billar-hero.jpg') center/cover fixed no-repeat;opacity:.55}.wrap{max-width:1500px;margin:auto;padding:clamp(14px,2.4vw,34px)}.top{display:grid;grid-template-columns:minmax(180px,330px) 1fr auto;align-items:center;gap:clamp(14px,2vw,30px);padding:clamp(14px,2vw,24px);border:1px solid #b88e485e;border-radius:26px;background:linear-gradient(120deg,#061713f2,#07151cf2);box-shadow:0 20px 55px #0009}.logoBox{height:clamp(92px,11vw,150px);display:flex;align-items:center;justify-content:center;padding:5px}.logoBox img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 18px #000a)}.eyebrow{color:var(--gold);font-size:clamp(.72rem,1.2vw,1rem);font-weight:900;letter-spacing:.18em;text-transform:uppercase}.title{margin:4px 0 6px;font-size:clamp(1.7rem,3.7vw,3.8rem);line-height:1;font-weight:900;letter-spacing:-.04em}.state{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:#0b3428;border:1px solid #22c77755;color:#bdf4d3;font-size:clamp(.72rem,1.1vw,.95rem);font-weight:850}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 14px #20c875}.clock{text-align:right;color:var(--muted);font-size:clamp(.78rem,1.1vw,1rem);white-space:nowrap}.clock b{display:block;color:#fff;font-size:clamp(1rem,1.5vw,1.25rem);margin-top:4px}.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin-top:18px;padding:clamp(20px,3vw,38px);min-height:180px;border:1px solid #c59a4e;border-radius:28px;background:linear-gradient(100deg,#062a22ed,#07382fed 58%,#071b1ced),url('billar-luxury-clean.jpg') center/cover no-repeat;box-shadow:inset 0 1px #ffe4a13a,0 22px 50px #0009}.hero h2{font-size:clamp(1.8rem,4vw,4rem);margin:5px 0}.hero .sub{color:#d8e5df;font-size:clamp(.95rem,1.5vw,1.25rem)}.mesaNum{text-align:right}.mesaNum small{display:block;color:#f3ddb0;font-weight:800;letter-spacing:.15em}.mesaNum strong{display:block;color:var(--gold);font-family:Georgia,serif;font-size:clamp(4.2rem,9vw,8rem);line-height:.82;text-shadow:0 5px 18px #000}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.stat{padding:16px 18px;border:1px solid #8f74485c;border-radius:18px;background:#07181bd9}.stat small{display:block;color:var(--muted);font-weight:750;text-transform:uppercase;letter-spacing:.08em}.stat strong{display:block;margin-top:4px;font-size:clamp(1.45rem,2.8vw,2.5rem);color:var(--gold)}.grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(340px,.88fr);gap:18px;margin-top:18px}.card{border:1px solid #987a4863;border-radius:24px;background:linear-gradient(145deg,var(--panel2),var(--panel));box-shadow:0 18px 42px #0007;padding:clamp(18px,2.3vw,28px);overflow:hidden}.cardHead{display:flex;justify-content:space-between;align-items:end;gap:14px;padding-bottom:14px;border-bottom:1px solid #8f74485a}.card h3{margin:0;font-size:clamp(1.35rem,2.2vw,2rem)}.cardHead strong{color:var(--gold);font-size:clamp(1.35rem,2.5vw,2.25rem)}.item{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:14px 0;border-bottom:1px solid #27443f;font-size:clamp(1rem,1.55vw,1.35rem)}.item:last-child{border-bottom:0}.item small{color:var(--muted)}.item b:last-child{white-space:nowrap}.roundTotal{margin-top:12px;padding:14px 16px;border-radius:15px;background:#0d2b25;border:1px solid #b18b4857}.roundTotal .item{padding:8px 0}.player{padding:14px 0;border-bottom:1px solid #28463f}.player:last-child{border-bottom:0}.playerTop{display:flex;justify-content:space-between;gap:14px;align-items:center}.playerName{font-size:clamp(1.1rem,1.7vw,1.5rem);font-weight:900}.balance{font-size:clamp(1.2rem,2vw,1.8rem);font-weight:900;color:var(--gold)}.paid{color:#79dca8}.breakdown{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:clamp(.82rem,1.1vw,1rem)}.extraTag{color:#f4ca63}.history{margin-top:18px}.history .item{align-items:flex-start}.tagline{text-align:center;color:#e8c66e;font-family:Georgia,serif;font-style:italic;font-size:clamp(1.1rem,2vw,1.6rem);letter-spacing:.05em;padding:25px 10px 8px}.empty{padding:35px 10px;text-align:center;color:var(--muted)}
@media(max-width:820px){.top{grid-template-columns:1fr auto}.logoBox{grid-column:1/-1;height:112px}.topMain{grid-column:1}.clock{grid-column:2}.grid{grid-template-columns:1fr}.hero{min-height:145px}.summary{grid-template-columns:1fr 1fr}.summary .stat:last-child{grid-column:1/-1}.item{font-size:1rem}}
@media(max-width:520px){.wrap{padding:12px}.top{padding:14px;border-radius:20px}.logoBox{height:100px}.title{font-size:1.7rem}.clock{font-size:.72rem}.hero{padding:18px;border-radius:22px}.mesaNum strong{font-size:4.2rem}.summary{gap:9px}.stat{padding:12px}.card{padding:16px;border-radius:20px}.playerTop{align-items:flex-start}.balance{text-align:right}}
@media(min-width:1200px) and (orientation:landscape){.wrap{padding-top:22px}.top{min-height:150px}.hero{min-height:210px}.grid{align-items:start}.card{min-height:360px}}
</style></head><body><div class="wrap" id="app"></div><script>
const KEY='lhAdminV4',COP=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0),GAME=2000,params=new URLSearchParams(location.search),id=params.get('table')||'B1';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rc(r){return(r?.items||[]).reduce((s,i)=>s+(+i.price||0)*(+i.qty||0),0)}
function accountData(a){let names=new Set(),rounds={},extras={},paid={},returns={};for(const z of a.rounds||[]){names.add(z.loser);rounds[z.loser]=(rounds[z.loser]||0)+GAME+rc(z)}for(const e of a.playerExtras||[]){names.add(e.player);extras[e.player]=(extras[e.player]||0)+(+e.price||0)*(+e.qty||0)}for(const p of a.payments||[]){if(p.player){names.add(p.player);paid[p.player]=(paid[p.player]||0)+(+p.amount||0)}}for(const d of a.returns||[]){if(d.player){names.add(d.player);returns[d.player]=(returns[d.player]||0)+(+d.credit||0)}}return [...names].map(name=>({name,rounds:rounds[name]||0,extras:extras[name]||0,paid:paid[name]||0,returns:returns[name]||0,balance:Math.max(0,(rounds[name]||0)+(extras[name]||0)-(paid[name]||0)-(returns[name]||0))})).sort((x,y)=>y.balance-x.balance)}
function draw(){let S;try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}let t=S?.tables?.find(x=>x.id===id),a=t?.account;if(!a){app.innerHTML=`<div class="top"><div class="logoBox"><img src="herradura-logo-master.png" alt="La Herradura"></div><div class="topMain"><div class="eyebrow">Pantalla del cliente</div><div class="title">${esc(t?.name||id)}</div><span class="state">Mesa disponible</span></div><div class="clock">LA HERRADURA<b>${new Date().toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'})}</b></div></div><div class="card empty" style="margin-top:18px"><h2>🎱 Mesa disponible</h2><p>Esperando apertura de cuenta…</p></div>`;return}
let r=a.activeRound,n=(a.rounds?.length||0)+1,players=accountData(a),roundNow=rc(r),totalPending=players.reduce((s,p)=>s+p.balance,0),mesa=(t.name.match(/\d+/)||['1'])[0];
app.innerHTML=`<div class="top"><div class="logoBox"><img src="herradura-logo-master.png" alt="Billares La Herradura Club"></div><div class="topMain"><div class="eyebrow">Billares La Herradura Club · Experiencia Premium</div><div class="title">${esc(t.name)} · Partida ${n}</div><span class="state"><span class="dot"></span> PARTIDA EN CURSO</span></div><div class="clock">${esc(a.group||'')}<b>${new Date().toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'})}</b></div></div>
<div class="hero"><div><div class="eyebrow">Mesa activa</div><h2>${esc(a.group||'Cuenta de billar')}</h2><div class="sub">Disfruta el juego. Tu consumo y tus cuentas se actualizan automáticamente.</div></div><div class="mesaNum"><small>MESA DE BILLAR</small><strong>${mesa}</strong></div></div>
<div class="summary"><div class="stat"><small>Consumo ronda actual</small><strong>${COP(roundNow)}</strong></div><div class="stat"><small>Chico al finalizar</small><strong>${COP(GAME)}</strong></div><div class="stat"><small>Total pendiente mesa</small><strong>${COP(totalPending)}</strong></div></div>
<div class="grid"><section class="card"><div class="cardHead"><h3>🧾 Ronda actual · Partida ${n}</h3><strong>${COP(roundNow)}</strong></div>${r?.items?.length?r.items.map(i=>`<div class="item"><span><b>${esc(i.name)}</b> × ${+i.qty||0}${i.extra?' <small>· Extra de ronda</small>':''}<br><small>${i.addedAt?new Date(i.addedAt).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'}):''}</small></span><b>${COP((+i.price||0)*(+i.qty||0))}</b></div>`).join(''):'<div class="empty">Aún no hay productos despachados en esta ronda.</div>'}<div class="roundTotal"><div class="item"><b>Consumo de ronda</b><b>${COP(roundNow)}</b></div><div class="item"><span>🎱 Chico al finalizar</span><b>${COP(GAME)}</b></div><div class="item"><b>Total que se asignará al perdedor</b><b>${COP(roundNow+GAME)}</b></div></div></section>
<section class="card"><div class="cardHead"><h3>👥 Cuentas de jugadores</h3><strong>${COP(totalPending)}</strong></div>${players.length?players.map(p=>`<div class="player"><div class="playerTop"><div class="playerName">👤 ${esc(p.name)}</div><div class="balance ${p.balance<=0?'paid':''}">${p.balance>0?COP(p.balance):'✓ PAGADO'}</div></div><div class="breakdown"><span>🎱 Rondas + chicos: <b>${COP(p.rounds)}</b></span>${p.extras?`<span class="extraTag">🟡 Extras personales: <b>${COP(p.extras)}</b></span>`:''}${p.returns?`<span>↩️ Devoluciones: −${COP(p.returns)}</span>`:''}</div></div>`).join(''):'<div class="empty">Aún no hay partidas asignadas.</div>'}</section></div>
<section class="card history"><div class="cardHead"><h3>🏁 Historial de partidas</h3><strong>${a.rounds?.length||0} finalizadas</strong></div>${a.rounds?.length?[...a.rounds].reverse().slice(0,8).map(z=>`<div class="item"><span><b>Partida ${(a.rounds||[]).indexOf(z)+1}</b> · Perdedor: <b>${esc(z.loser)}</b><br><small>${(z.items||[]).map(x=>`${esc(x.name)} ×${+x.qty||0}`).join(' · ')||'Sin consumo'} · Chico ${COP(GAME)}</small></span><b>${COP(GAME+rc(z))}</b></div>`).join(''):'<div class="empty">Sin partidas finalizadas.</div>'}</section>
${(a.returns||[]).length?`<section class="card history"><div class="cardHead"><h3>↩️ Devoluciones aplicadas</h3></div>${[...a.returns].reverse().slice(0,8).map(d=>`<div class="item"><span>${esc(d.name)} × ${+d.qty||0}${d.player?' · '+esc(d.player):''}</span><b>− ${COP(d.credit)}</b></div>`).join('')}</section>`:''}<div class="tagline">✦ La Herradura · Juega · Disfruta · Comparte ✦</div>`}
draw();addEventListener('storage',e=>{if(e.key===KEY)draw()});setInterval(draw,2500);
</script></body></html>
